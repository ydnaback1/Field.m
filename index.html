<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a20" />
  <title>Field Maps</title>
  <link rel="icon" type="image/svg+xml" href="explore_24dp_FILL0_wght400_GRAD0_opsz24.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.78.0/dist/L.Control.Locate.min.css" />
  <link rel="stylesheet" href="plugins/leaflet-measure/leaflet.measure.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body>
  <div id="map-uk"></div>
  <div id="map-world"></div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.7.0/proj4.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.78.0/dist/L.Control.Locate.min.js"></script>
  <script src="plugins/leaflet-measure/leaflet.measure.js"></script>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
  <script src="config.runtime.js"></script>
  <script src="config.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/routes.js"></script>

  <div id="bottom-panel" role="region" aria-label="Routes" aria-hidden="true" inert>
    <div id="panel-topbar">
      <div id="panel-drag" aria-hidden="true"></div>
      <button id="panel-close" type="button" title="Close routes" aria-label="Close routes">
        <i class="fas fa-chevron-down" aria-hidden="true"></i>
      </button>
    </div>
    <div id="panel-content"></div>
    <div id="draw-toolbar-container"></div>
  </div>
  <button id="fab-route-backup" type="button" title="Route data and backup" aria-label="Route data and backup" aria-controls="bottom-panel">
    <i class="fas fa-database" aria-hidden="true"></i>
  </button>
  <button id="fab-route" type="button" title="Open routes" aria-label="Open routes" aria-controls="bottom-panel" aria-expanded="false">
    <i class="fas fa-route" aria-hidden="true"></i>
  </button>


  <script src="js/map.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.warn("Field Maps service worker registration failed.", error);
        });
      });
    }
  </script>


</body>
</html>
