<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a20" />
  <title>Field Maps</title>
  <link rel="icon" type="image/svg+xml" href="explore_24dp_FILL0_wght400_GRAD0_opsz24.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/leaflet-locatecontrol/L.Control.Locate.min.css" />
  <link rel="stylesheet" href="plugins/leaflet-measure/leaflet.measure.css" />
  <link rel="stylesheet" href="vendor/leaflet-draw/leaflet.draw.css" />
  <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css"/>
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body>
  <div id="map-uk"></div>
  <div id="map-world"></div>
  <div id="map-switch-notice" class="map-switch-notice" role="status" aria-live="polite" hidden></div>
  <aside id="app-update-notice" class="app-update-notice" role="status" hidden>
    <span>Update available</span>
    <button id="app-update-now" type="button">Update now</button>
  </aside>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/proj4/proj4.js"></script>
  <script src="vendor/proj4leaflet/proj4leaflet.min.js"></script>
  <script src="vendor/leaflet-locatecontrol/L.Control.Locate.min.js"></script>
  <script src="plugins/leaflet-measure/leaflet.measure.js"></script>
  <script src="vendor/leaflet-draw/leaflet.draw.js"></script>
  <script src="config.runtime.js"></script>
  <script src="config.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/search.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/routes.js"></script>

  <div id="bottom-panel" role="region" aria-label="Routes" aria-hidden="true" inert>
    <div id="panel-topbar">
      <button id="panel-route-toggle" type="button" title="Open routes" aria-label="Open routes">
        <i class="fas fa-route" aria-hidden="true"></i><span>Routes</span>
      </button>
      <div id="panel-drag" aria-hidden="true"></div>
      <button id="panel-settings" type="button" title="Settings and tools" aria-label="Settings and tools">
        <i class="fas fa-gear" aria-hidden="true"></i>
      </button>
      <button id="panel-close" type="button" title="Close routes" aria-label="Close routes">
        <i class="fas fa-chevron-down" aria-hidden="true"></i>
      </button>
    </div>
    <div id="panel-content"></div>
    <div id="draw-toolbar-container"></div>
  </div>
  <button id="fab-route" type="button" title="Open routes" aria-label="Open routes" aria-controls="bottom-panel" aria-expanded="false">
    <i class="fas fa-route" aria-hidden="true"></i>
  </button>


  <script src="js/pwa.js"></script>
  <script src="js/map.js"></script>
  <script src="js/live-location.js"></script>


</body>
</html>
